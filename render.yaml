services:
  - type: web
    name: civicresolve-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_TEST_AUTH
        value: "false"
      - key: USE_DATA_URL_STORAGE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: https://civic-resolve-lt44aca7u-civic-resolve.vercel.app
      - key: GEMINI_API_KEY
        sync: false
